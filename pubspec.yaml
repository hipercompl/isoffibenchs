name: benchs
description: Benchmarks for inter-isolate communication and FFI.
version: 1.0.0
# repository: https://github.com/my_org/my_repo

environment:
  sdk: ^3.13.7

# Add regular dependencies here.
dependencies:
  ffi: ^2.2.0
  ffigen: ^23.0.0
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

ffigen:
    output: 'lib/nlib_ffi_bindings.dart'
    llvm-path: 
        - 'C:\devel\llvm'
    headers:
        entry-points:
            - 'native/nlib.h'
    name: 'NLib'
    description: 'Bindings to the test native library'
